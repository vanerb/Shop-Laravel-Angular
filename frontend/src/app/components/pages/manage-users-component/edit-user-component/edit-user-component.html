<div style="width: 100%; height: 100%">
  <div style="">
    <h1>Editar Usuario</h1>
  </div>

  <div>
    <form [formGroup]="form">
      <div style="display: flex; flex-direction: column;">
        <label class="text-primary" for="name">Nombre</label>
        <input formControlName="name"
               style="padding: 8px; margin-top: 8px; border-radius: 5px; border: 1px black solid"
               type="text" id="name" placeholder="Introduzca un nombre válido">
      </div>

      <div style="display: flex; flex-direction: column; margin-top: 20px">
        <label class="text-primary" for="subname">Apellidos</label>
        <input formControlName="subname"
               style="padding: 8px; margin-top: 8px; border-radius: 5px; border:1px black solid"
               type="text" id="subname" placeholder="Introduzca una descripcion válida">
      </div>

      <div style="display: flex; flex-direction: column; margin-top: 20px">
        <label class="text-primary" for="email">Email</label>
        <input formControlName="email"
               style="padding: 8px; margin-top: 8px; border-radius: 5px; border:1px black solid"
               type="text" id="email" placeholder="Introduzca un precio válido">
      </div>

      <div style="display: flex; flex-direction: column; margin-top: 20px;">
        <div style="display: block; justify-content: center; align-items: center; ">
          <div>
            <span >Numero de telefono</span>
          </div>
          <div style="display: flex; justify-content: start; align-items: start; width: 100%">
            <div style="width: 20%; margin-right: 30px">
              <input formControlName="prefix"
                     style="padding: 8px; margin-top: 8px; border-radius: 5px; border:1px black solid; width: 100%"
                     type="text" id="prefix" placeholder="Introduzca un precio válido">
            </div>
            <div style="width: 40%">
              <input formControlName="phone"
                     style="padding: 8px; margin-top: 8px; border-radius: 5px; border:1px black solid; width: 100%"
                     type="text" id="phone" placeholder="Introduzca un precio válido">
            </div>
          </div>


        </div>

      </div>
      <div style="display: flex; flex-direction: column; margin-top: 20px">
        <label class="text-primary" for="password">Contraseña</label>
        <input formControlName="password"
               style="padding: 8px; margin-top: 8px; border-radius: 5px; border:1px black solid"
               type="password" id="password" placeholder="Introduzca un precio válido">
      </div>
      <div style="display: flex; flex-direction: column; margin-top: 20px">
        <label class="text-primary" for="type">Tipo</label>
        <select formControlName="type" id="type">
          <option value="user">Cliente</option>
          <option value="admin">Administrador</option>
        </select>
      </div>

      <section class="image-upload-section">
        <div class="image-upload-heading"><div><label for="profile_photo">Foto de perfil</label><small>Previsualiza la foto antes de guardar los cambios</small></div><span>PERFIL</span></div>
        <div class="account-image-picker">
          <div class="account-image-preview"><img *ngIf="selectedCoverPreview() || existingCoverImage()" [src]="selectedCoverPreview() || getImageUrl(existingCoverImage()!)" alt="Vista previa del perfil"><span *ngIf="!selectedCoverPreview() && !existingCoverImage()">N</span></div>
          <label class="image-dropzone" for="profile_photo"><span class="image-dropzone-icon">＋</span><span class="image-dropzone-copy"><strong>{{ selectedCoverPreview() ? 'Cambiar fotografía' : 'Seleccionar fotografía' }}</strong><small>JPG, PNG o WEBP · La vista previa se actualiza al elegirla</small></span><input (change)="onImageChange($event)" accept="image/*" type="file" id="profile_photo"></label>
        </div>
        <button *ngIf="selectedCoverPreview()" class="image-preview-remove account-image-remove" type="button" (click)="removeSelectedImage()" aria-label="Quitar nueva fotografía">×</button>
      </section>

      <div style="display: flex; justify-content: end; align-items: end; margin-top: 20px">
        <button (click)="close()" style="border-radius: 10px; border: 1px #0f5132 solid; padding-right: 16px; padding-left: 16px; height: 40px; margin-right: 10px; color: black; cursor: pointer">Cancelar</button>
        <button (click)="update()" style="border-radius: 10px; border: 1px #0f5132 solid; background-color: #0f5132; padding-right: 16px; padding-left: 16px; height: 40px; margin-right: 10px; color: white; cursor: pointer">Editar</button>
      </div>
    </form>
  </div>
</div>
