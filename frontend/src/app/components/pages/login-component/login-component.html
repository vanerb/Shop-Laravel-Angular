<app-container-component>
  <main class="auth-page">
    <section class="auth-card">
      <div class="auth-brand"><span>N</span> NOVA</div>
      <div class="auth-heading"><small>QUÉ BUENO VERTE</small><h1>Entra a tu<br><em>espacio.</em></h1><p>Accede a tu cuenta y guarda tus próximos favoritos.</p></div>
      <form [formGroup]="form" (ngSubmit)="login()">
        <label>Correo electrónico<input formControlName="email" type="email" autocomplete="email" placeholder="nombre@correo.com"></label>
        <label>Contraseña<input formControlName="password" type="password" autocomplete="current-password" placeholder="Tu contraseña"></label>
        <p class="auth-error" *ngIf="authService.loginError()" role="alert">{{ authService.loginError() }}</p>
        <button class="auth-submit" type="submit" [disabled]="form.invalid">Entrar <span aria-hidden="true">↗</span></button>
      </form>
      <p class="auth-switch">¿Aún no tienes una cuenta? <a routerLink="/register">Crear cuenta</a></p>
    </section>
    <aside class="auth-art"><div class="auth-orb orb-a"></div><div class="auth-orb orb-b"></div><div class="auth-art-star">✳</div><span>OBJETOS PARA VIVIRLOS</span><h2>Las buenas<br>ideas empiezan<br><em>por elegir.</em></h2><small>DISEÑO QUE SUMA. DETALLES QUE DURAN.</small></aside>
  </main>
</app-container-component>
