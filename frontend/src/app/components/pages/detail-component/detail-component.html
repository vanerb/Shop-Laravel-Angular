<section class="detail-dialog" *ngIf="product">
  <header class="detail-dialog-header">
    <span class="detail-eyebrow">NOVA · DETALLE DEL PRODUCTO</span>
    <button class="detail-close" type="button" aria-label="Cerrar detalle" (click)="close()">×</button>
  </header>

  <div class="detail-hero-image">
    <img [src]="getImageUrl(currentImage)" [alt]="product.name + ' · imagen ' + (currentImageIndex() + 1)" />
    <button *ngIf="carouselImages.length > 1" class="detail-carousel-arrow detail-carousel-previous" type="button" aria-label="Imagen anterior" (click)="previousImage()">‹</button>
    <button *ngIf="carouselImages.length > 1" class="detail-carousel-arrow detail-carousel-next" type="button" aria-label="Imagen siguiente" (click)="nextImage()">›</button>
    <span class="detail-carousel-count" *ngIf="carouselImages.length > 1">{{ currentImageIndex() + 1 }} / {{ carouselImages.length }}</span>
  </div>

  <nav class="detail-carousel-thumbnails" *ngIf="carouselImages.length > 1" aria-label="Imágenes del producto">
    <button *ngFor="let image of carouselImages; let i = index" type="button" class="detail-carousel-thumbnail" [class.is-active]="i === currentImageIndex()" [attr.aria-label]="'Ver imagen ' + (i + 1)" [attr.aria-current]="i === currentImageIndex() ? 'true' : null" (click)="selectImage(i)">
      <img [src]="getImageUrl(image)" [alt]="product.name + ' · vista ' + (i + 1)" />
    </button>
  </nav>

  <div class="detail-content">
    <span class="detail-category">{{ product.category.name || 'Selección NOVA' }}</span>
    <h1>{{ product.name }}</h1>
    <p class="detail-price">{{ product.price | currency:'EUR':'symbol':'1.2-2' }}</p>
    <div class="detail-divider"></div>
    <h2>Descripción</h2>
    <p class="detail-description">{{ product.description || 'Este producto no tiene descripción.' }}</p>

    <button class="detail-add-button" type="button" (click)="addProductBasket(product)">
      Añadir al carrito <span aria-hidden="true">→</span>
    </button>
  </div>
</section>
