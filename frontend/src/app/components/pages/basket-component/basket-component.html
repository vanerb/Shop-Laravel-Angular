<app-container-component>
  <div class="basket-page">
    <div class="basket-heading"><span>MI SELECCIÓN</span><h1>Tu cesta<span>.</span></h1></div>
    <div class="basket-layout" *ngIf="basket().products.length; else emptyBasket">
      <div class="basket-items">
        <app-basket-card-component *ngFor="let product of paginatedProducts()" viewMode="editable" [product]="product" (remove)="removeProductBasket($event)"></app-basket-card-component>
        <app-pagination [totalItems]="basket().products.length" [pageSize]="pageSize" [currentPage]="page()" (pageChange)="page.set($event)"></app-pagination>
      </div>
      <aside class="basket-total"><span>Subtotal</span><strong>{{ calculateTotal() }} €</strong><small>Los gastos de envío se calculan al completar el pedido.</small><button type="button" (click)="goToProcess()">Continuar al pago <span>↗</span></button></aside>
    </div>
    <ng-template #emptyBasket><div class="basket-empty"><span>＋</span><h2>Tu cesta está esperando.</h2><p>Explora la tienda y guarda aquí lo que te guste.</p><a routerLink="/shop">Descubrir la tienda ↗</a></div></ng-template>
  </div>
</app-container-component>
