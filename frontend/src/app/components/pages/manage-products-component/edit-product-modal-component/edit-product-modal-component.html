<div style="width: 100%; height: 100%">
  <div style="">
    <h1>Editar producto</h1>
  </div>

  <div>
    <form [formGroup]="form">
      <div style="display: flex; flex-direction: column;">
        <label class="text-primary" for="name">Nombre</label>
        <input formControlName="name"
               style="padding: 8px; margin-top: 8px; border-radius: 5px; border: 1px black solid"
               type="text" id="name" placeholder="Introduzca un nombre válido">
      </div>

      <div style="display: flex; flex-direction: column; margin-top: 20px">
        <label class="text-primary" for="description">Descripcion</label>
        <input formControlName="description"
               style="padding: 8px; margin-top: 8px; border-radius: 5px; border:1px black solid"
               type="text" id="description" placeholder="Introduzca una descripcion válida">
      </div>

      <div style="display: flex; flex-direction: column; margin-top: 20px">
        <label class="text-primary" for="price">Precio</label>
        <input formControlName="price"
               style="padding: 8px; margin-top: 8px; border-radius: 5px; border:1px black solid"
               type="text" id="price" placeholder="Introduzca un precio válido">
      </div>

      <div style="display: flex; flex-direction: column; margin-top: 20px">
        <label class="text-primary" for="category_id">Categoria</label>
        <select  style="padding: 8px; margin-top: 8px; border-radius: 5px; border:1px black solid" formControlName="category_id" id="category_id">
          <option *ngFor="let category of categories()" value="{{ category.id }}">{{ category.name }}</option>
        </select>

      </div>

      <section class="image-upload-section">
        <div class="image-upload-heading"><div><label for="cover_image">Imagen de portada</label><small>Elige la imagen principal del producto</small></div><span>PORTADA</span></div>
        <div class="edit-cover-preview" *ngIf="selectedCoverPreview() || existingCoverImage()">
          <img [src]="selectedCoverPreview() || getImageUrl(existingCoverImage()!)" alt="Vista previa de portada">
          <span>{{ selectedCoverPreview() ? 'Nueva portada' : 'Portada actual' }}</span>
          <button type="button" class="image-preview-remove" (click)="selectedCoverPreview() ? removeSelectedCover() : removeExistingCover()" aria-label="Quitar imagen de portada">×</button>
        </div>
        <label class="image-dropzone image-dropzone-cover" for="cover_image" [class.has-preview]="selectedCoverPreview() || existingCoverImage()">
          <span class="image-dropzone-icon">＋</span><span class="image-dropzone-copy"><strong>{{ selectedCoverPreview() || existingCoverImage() ? 'Cambiar imagen de portada' : 'Seleccionar imagen de portada' }}</strong><small>JPG, PNG o WEBP · Recomendado 1200 × 1500 px</small></span>
          <input (change)="onCoverImageChange($event)" accept="image/*" type="file" id="cover_image">
        </label>
      </section>

      <section class="image-upload-section">
        <div class="image-upload-heading"><div><label for="images">Galería del producto</label><small>Imágenes actuales y nuevas</small></div><span>{{ existingGalleryImages().length + galleryPreviews().length }} IMÁGENES</span></div>
        <label class="image-dropzone image-dropzone-compact" for="images">
          <span class="image-dropzone-icon">▧</span><span class="image-dropzone-copy"><strong>Añadir imágenes a la galería</strong><small>Puedes seleccionar varias imágenes a la vez</small></span>
          <input (change)="onGalleryImagesChange($event)" accept="image/*" type="file" id="images" multiple>
        </label>
        <div class="image-preview-grid" *ngIf="existingGalleryImages().length || galleryPreviews().length">
          <figure class="image-preview-card" *ngFor="let image of existingGalleryImages()">
            <img [src]="getImageUrl(image)" alt="Imagen actual del producto">
            <figcaption>Imagen actual</figcaption>
            <button type="button" class="image-preview-remove" (click)="removeExistingGallery(image)" aria-label="Quitar imagen actual">×</button>
          </figure>
          <figure class="image-preview-card" *ngFor="let preview of galleryPreviews()">
            <img [src]="preview.url" [alt]="preview.file.name">
            <figcaption [title]="preview.file.name">{{ preview.file.name }}</figcaption>
            <button type="button" class="image-preview-remove" (click)="removeSelectedGallery(preview.file)" aria-label="Quitar nueva imagen">×</button>
          </figure>
        </div>
      </section>

      <div style="display: flex; justify-content: end; align-items: end; margin-top: 20px">
        <button (click)="close()" style="border-radius: 10px; border: 1px #0f5132 solid; padding-right: 16px; padding-left: 16px; height: 40px; margin-right: 10px; color: black; cursor: pointer">Cancelar</button>
        <button (click)="update()" style="border-radius: 10px; border: 1px #0f5132 solid; background-color: #0f5132; padding-right: 16px; padding-left: 16px; height: 40px; margin-right: 10px; color: white; cursor: pointer">Editar</button>
      </div>
    </form>
  </div>
</div>
