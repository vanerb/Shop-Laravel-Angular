<app-container-component>
  <main class="contact-page">
    <section class="contact-card">
      <div class="contact-heading"><span>ESTAMOS AL OTRO LADO</span><h1>Hablemos<br><em>tranquilamente.</em></h1><p>Cuéntanos qué necesitas. Nos encantará leerte.</p></div>
      <form (submit)="$event.preventDefault()">
        <label>Nombre<input type="text" id="name" autocomplete="name" placeholder="Tu nombre"></label>
        <label>Correo electrónico<input type="email" id="email" autocomplete="email" placeholder="nombre@correo.com"></label>
        <label>¿En qué podemos ayudarte?<textarea id="description" placeholder="Escribe aquí tu consulta" rows="5"></textarea></label>
        <button type="submit">Enviar mensaje <span aria-hidden="true">↗</span></button>
        <small>Respondemos de lunes a viernes, normalmente en menos de 24 horas.</small>
      </form>
    </section>
    <aside class="contact-art"><span>NOVA / CONTACTO</span><div>✳</div><h2>Las buenas<br>conversaciones<br><em>empiezan aquí.</em></h2></aside>
  </main>
</app-container-component>
