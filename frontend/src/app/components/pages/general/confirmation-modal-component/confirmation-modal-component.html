<section class="admin-confirmation">
  <span class="admin-confirmation-icon" aria-hidden="true">!</span>
  <span class="admin-eyebrow">CONFIRMAR ACCIÓN</span>
  <h2>{{ title }}</h2>
  <p>{{ message }}</p>
  <div class="admin-confirmation-actions">
    <button class="admin-secondary" type="button" (click)="close()">Cancelar</button>
    <button class="admin-danger" type="button" (click)="confirm()">Aceptar</button>
  </div>
</section>
