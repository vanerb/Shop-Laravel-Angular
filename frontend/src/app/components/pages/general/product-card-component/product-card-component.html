<article class="product-card" (click)="openDetails(item())" tabindex="0" (keydown.enter)="openDetails(item())" [attr.aria-label]="'Ver ' + item()?.name">
  <div class="product-image">
    <img [src]="getImageUrl(item())" [alt]="item()?.name || 'Producto de la tienda'" loading="lazy">
    <span class="image-index">{{ item()?.category?.name || 'NATIVA' }}</span>
    <button class="quick-view" type="button" (click)="openDetails(item()); $event.stopPropagation()" [attr.aria-label]="'Ver detalles de ' + item()?.name">↗</button>
  </div>
  <div class="product-info">
    <span class="product-category">{{ item()?.category?.name || 'SELECCIÓN NATIVA' }}</span>
    <h3>{{ item()?.name }}</h3>
    <p>{{ item()?.description }}</p>
    <div class="product-bottom">
      <span class="product-price">{{ item()?.price }} <small>€</small></span>
      <button class="add-button" type="button" (click)="addProductBasket(item()); $event.stopPropagation()" aria-label="Agregar al carrito">+</button>
    </div>
  </div>
</article>
