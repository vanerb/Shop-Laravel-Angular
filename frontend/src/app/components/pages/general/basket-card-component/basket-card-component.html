<article class="basket-card">
  <div class="basket-product-image"><img [src]="getImageUrl(getCoverImage(product()))" [alt]="product().name"></div>
  <div class="basket-product-copy">
    <span>{{ product().category.name || 'NOVA' }}</span>
    <h3>{{ product().name }}</h3>
    <p>{{ product().description }}</p>
  </div>
  <div class="basket-quantity"><span>{{ product().pivot.quantity }} ×</span><strong>{{ product().price }} €</strong></div>
  <button *ngIf="viewMode()==='editable'" class="remove-product" type="button" (click)="removeProductBasket(product())">Quitar</button>
</article>
